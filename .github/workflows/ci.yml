name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linecheck:
    runs-on: ubuntu-latest
    env:
      LINECHECK_VERSION: v1.2.2
    steps:
      - uses: actions/checkout@v7
      - name: Install linecheck
        run: |
          name="linecheck-${LINECHECK_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSfL "https://github.com/tupe12334/linecheck/releases/download/${LINECHECK_VERSION}/${name}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      # Limits live in linecheck.yml; exits non-zero when a file exceeds its error threshold.
      - run: linecheck .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The test web server runs `pnpm build`, which includes `astro check`.
      - run: pnpm test
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
