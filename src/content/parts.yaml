pipedream:
  layer: workflow
  name: Pipedream
  summary: Code-first serverless workflows and an AI agent builder for 3,000+ apps.
  url: https://pipedream.com
windmill:
  layer: workflow
  name: Windmill
  summary: Open-source scripts and flows platform with AI agent steps.
  url: https://www.windmill.dev/docs/core_concepts/ai_agents
trigger-dev:
