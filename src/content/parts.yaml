azure-logic-apps:
  layer: workflow
  name: Azure Logic Apps
  summary: Azure integration workflows with agent loops and 1,400+ connectors.
  url: https://learn.microsoft.com/en-us/azure/logic-apps/agent-workflows-concepts
aws-step-functions:
  layer: workflow
  name: AWS Step Functions
