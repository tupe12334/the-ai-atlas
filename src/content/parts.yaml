# Every part a build can use, keyed by id. Stacks in solutions/ and builder links refer to parts by id.
# `needs` lists the parts this one works with in another layer. A build that picks this part
# and a part outside the list in that layer gets a warning with `why`.

on-prem:
  layer: runtime
  name: On-prem
  summary: Your own machine or server.
cloud:
  layer: runtime
  name: Cloud
  summary: Hosted by a vendor, nothing to run yourself.

claude-code:
  layer: agent
  name: Claude Code
  summary: Anthropic's coding agent for the terminal.
  url: https://code.claude.com/docs
  needs:
    - parts: [claude]
      why: Anthropic does not support routing Claude Code to non-Claude models.
      source: https://code.claude.com/docs/en/llm-gateway
codex:
  layer: agent
  name: Codex
  summary: OpenAI's coding agent, as a CLI or in cloud sandboxes.
  url: https://openai.com/codex
  needs:
    - parts: [openai, any-openai-compatible, local-models, mistral]
      why: Codex runs OpenAI models, other providers set in its config, or local models with its --oss mode.
      source: https://learn.chatgpt.com/docs/config-file/config-advanced
hermes:
  layer: agent
  name: Hermes
  summary: Nous Research's self-hosted agent with tools, memory and a scheduler.
  url: https://github.com/NousResearch/hermes-agent
n8n-ai-agent:
  layer: agent
  name: n8n AI Agent
  summary: The agent node inside n8n workflows.
  url: https://docs.n8n.io/build/integrate-ai
  needs:
    - parts: [n8n]
      why: The AI Agent node only runs inside n8n workflows.
zapier-agents:
  layer: agent
  name: Zapier Agents
  summary: Hosted agents that act across the apps you connect to Zapier.
  url: https://zapier.com/agents
  needs:
    - parts: [cloud]
      why: Zapier is hosted only. You cannot run it yourself.
    - parts: [zapier]
      why: Zapier Agents act through Zapier, not another workflow tool.
activepieces-agents:
  layer: agent
  name: Activepieces agents
  summary: AI agent steps inside Activepieces flows.
  url: https://github.com/activepieces/activepieces
  needs:
    - parts: [activepieces]
      why: Activepieces agents only run inside Activepieces flows.

github-actions:
  layer: workflow
  name: GitHub Actions
  summary: Workflows that run on GitHub events or on a schedule.
  url: https://docs.github.com/actions
n8n:
  layer: workflow
  name: n8n
  summary: Open-source workflow automation. Self-host it or use n8n Cloud.
  url: https://n8n.io
zapier:
  layer: workflow
  name: Zapier
  summary: Hosted automation across thousands of apps.
  url: https://zapier.com
  needs:
    - parts: [cloud]
      why: Zapier is hosted only. You cannot run it yourself.
activepieces:
  layer: workflow
  name: Activepieces
  summary: Open-source workflow automation with MCP servers. Self-host it or use the cloud version.
  url: https://github.com/activepieces/activepieces

github-actions-cron:
  layer: scheduler
  name: GitHub Actions cron
  summary: The schedule trigger of GitHub Actions workflows.
  url: https://docs.github.com/actions/reference/events-that-trigger-workflows#schedule
  needs:
    - parts: [github-actions]
      why: A GitHub Actions cron only triggers GitHub Actions workflows.
moadim:
  layer: scheduler
  name: Moadim
  summary: Scheduled agent routines on your own machine.
  url: https://moadim.io
  needs:
    - parts: [on-prem]
      why: Moadim runs routines on your own machine.
claude-routines:
  layer: scheduler
  name: Claude routines
  summary: Scheduled Claude Code agents on Anthropic's cloud.
  url: https://code.claude.com/docs/en/routines
  needs:
    - parts: [cloud]
      why: Claude routines run on Anthropic's cloud, not on your machine.
    - parts: [claude-code]
      why: Claude routines only run Claude Code.
hermes-cron:
  layer: scheduler
  name: Hermes cron
  summary: The scheduler built into Hermes.
  url: https://github.com/NousResearch/hermes-agent
  needs:
    - parts: [hermes]
      why: Hermes cron is built into Hermes and only runs Hermes tasks.
n8n-schedule-trigger:
  layer: scheduler
  name: n8n Schedule Trigger
  summary: The trigger node that starts n8n workflows on a schedule.
  url: https://docs.n8n.io/integrations/builtin/core-nodes/n8n-nodes-base.scheduletrigger/
  needs:
    - parts: [n8n]
      why: The Schedule Trigger is an n8n node and only starts n8n workflows.

claude:
  layer: models
  name: Claude
  summary: Anthropic's models.
  url: https://www.anthropic.com/claude
openai:
  layer: models
  name: OpenAI
  summary: OpenAI's GPT models.
  url: https://platform.openai.com/docs/models
any-openai-compatible:
  layer: models
  name: Any OpenAI-compatible
  summary: Any provider with an OpenAI-compatible API, such as OpenRouter.
local-models:
  layer: models
  name: Local models
  summary: Open-weight models that run on hardware you control.

# ---- Added from vendor research, 2026-10-07. Each rule cites its source. ----

# Agents
claude-agent-sdk:
  layer: agent
  name: Claude Agent SDK
  summary: Python and TypeScript library that runs the Claude Code agent loop in your own process.
  url: https://code.claude.com/docs/en/agent-sdk/overview
  needs:
    - parts: [claude]
      why: The Agent SDK runs Claude models only.
      source: https://code.claude.com/docs/en/agent-sdk/overview
claude-managed-agents:
  layer: agent
  name: Claude Managed Agents
  summary: Anthropic-hosted agent harness, with the sandbox in Anthropic's cloud or your own.
  url: https://platform.claude.com/docs/en/managed-agents/overview
  needs:
    - parts: [claude]
      why: Managed Agents run Claude models only.
      source: https://platform.claude.com/docs/en/managed-agents/overview
openai-agents-sdk:
  layer: agent
  name: OpenAI Agents SDK
  summary: Python library for multi-agent workflows. Other model providers work through LiteLLM adapters, in beta.
  url: https://openai.github.io/openai-agents-python/
gemini-cli:
  layer: agent
  name: Gemini CLI
  summary: Google's open-source terminal agent for Gemini. Also runs in GitHub Actions with run-gemini-cli.
  url: https://google-gemini.github.io/gemini-cli/
jules:
  layer: agent
  name: Jules
  summary: Google's async coding agent. It clones your GitHub repo into a cloud VM and opens a pull request.
  url: https://jules.google/docs/
  needs:
    - parts: [cloud]
      why: Jules works in a Google-run virtual machine, not on your computer.
      source: https://jules.google/docs/
    - parts: [gemini]
      why: Jules runs on Google's Gemini models.
      source: https://developers.googleblog.com/en/jules-gemini-3/
copilot-coding-agent:
  layer: agent
  name: Copilot coding agent
  summary: GitHub's cloud agent. Assign it an issue and it works in a GitHub Actions environment, then opens a pull request.
  url: https://docs.github.com/en/copilot/concepts/agents/coding-agent/about-coding-agent
copilot-cli:
  layer: agent
  name: Copilot CLI
  summary: GitHub Copilot in the terminal. Bring your own key or a local model through Ollama.
  url: https://docs.github.com/en/copilot/concepts/agents/about-copilot-cli
cursor-cloud-agents:
  layer: agent
  name: Cursor cloud agents
  summary: Cursor agents that run in Cursor-managed VMs or on your own machines, started from GitHub, Slack, Linear and more.
  url: https://cursor.com/docs/cloud-agent
cursor-cli:
  layer: agent
  name: Cursor CLI
  summary: Cursor's agent in the terminal and in CI.
  url: https://cursor.com/docs/cli/overview
cursor-bugbot:
  layer: agent
  name: Cursor Bugbot
  summary: Hosted pull request reviewer for GitHub, GitLab, Bitbucket and Azure DevOps.
  url: https://cursor.com/docs/bugbot
  needs:
    - parts: [cloud]
      why: Bugbot is a hosted Cursor service.
      source: https://cursor.com/docs/bugbot
devin:
  layer: agent
  name: Devin
  summary: Cognition's autonomous software engineer, started from Slack, Teams, Linear, Jira or its API.
  url: https://docs.devin.ai/
  needs:
    - parts: [cloud]
      why: Even inside your VPC, Devin's brain is hosted in Cognition's tenant.
      source: https://docs.devin.ai/enterprise/vpc/overview
devin-desktop:
  layer: agent
  name: Devin Desktop (formerly Windsurf)
  summary: Cognition's agentic IDE on your machine.
  url: https://docs.devin.ai/desktop/models
  needs:
    - parts: [on-prem]
      why: Devin Desktop is an IDE that runs on your machine.
      source: https://docs.devin.ai/desktop/models
kiro:
  layer: agent
  name: Kiro
  summary: Amazon's agentic IDE and CLI, the successor of Amazon Q Developer CLI.
  url: https://kiro.dev/docs/
kiro-autonomous-agent:
  layer: agent
  name: Kiro autonomous agent
  summary: Amazon's cloud agent, started with a kiro label or a /kiro comment on GitHub.
  url: https://kiro.dev/docs/autonomous-agent/
  needs:
    - parts: [cloud]
      why: The Kiro autonomous agent runs in AWS cloud environments.
      source: https://kiro.dev/docs/autonomous-agent/
kiro-crew:
  layer: agent
  name: Kiro Crew
  summary: Open-source persistent personal agent with cron, webhooks and chat apps.
  url: https://kiro.dev/docs/crew/
  needs:
    - parts: [on-prem]
      why: Kiro Crew runs on your machine, in a container or on your remote machine, not in AWS cloud.
      source: https://kiro.dev/docs/crew/
amp:
  layer: agent
  name: Amp
  summary: Sourcegraph's coding agent, in the terminal or in cloud threads.
  url: https://ampcode.com/manual
aider:
  layer: agent
  name: Aider
  summary: Open-source pair programmer in the terminal for almost any model.
  url: https://aider.chat/
  needs:
    - parts: [on-prem]
      why: Aider is a CLI that runs on your machine.
      source: https://aider.chat/
openhands:
  layer: agent
  name: OpenHands
  summary: Open-source coding agent. Self-host it, use the cloud app, or run it as a GitHub Action.
  url: https://docs.openhands.dev/
cline:
  layer: agent
  name: Cline
  summary: Open-source coding agent for VS Code and a headless CLI.
  url: https://docs.cline.bot/
goose:
  layer: agent
  name: Goose
  summary: Open-source local agent started at Block, now at the Linux Foundation, with scheduled recipes.
  url: https://github.com/aaif-goose/goose
factory-droids:
  layer: agent
  name: Factory Droids
  summary: Factory's coding agents for the terminal, CI, Slack and Linear.
  url: https://docs.factory.com/
replit-agent:
  layer: agent
  name: Replit Agent
  summary: Builds and deploys apps inside Replit's cloud workspace.
  url: https://docs.replit.com/replitai/agent
warp-cloud-agents:
  layer: agent
  name: Warp cloud agents
  summary: Warp's agent platform. Agents run Warp-hosted, self-hosted in Docker, or in your CI, with schedules.
  url: https://docs.warp.dev/agent-platform/cloud-agents/overview
mistral-vibe:
  layer: agent
  name: Mistral Vibe
  summary: Mistral's open-source terminal agent, powered by Devstral, for any OpenAI-compatible model.
  url: https://docs.mistral.ai/mistral-vibe/overview
grok-build:
  layer: agent
  name: Grok Build
  summary: xAI's terminal agent with interactive and headless modes.
  url: https://docs.x.ai/build/overview
zed-agent:
  layer: agent
  name: Zed agent
  summary: The agent panel in the Zed editor. It also hosts external agents through ACP.
  url: https://zed.dev/docs/ai/external-agents
  needs:
    - parts: [on-prem]
      why: Zed is an editor that runs on your machine.
      source: https://zed.dev/docs/ai/external-agents
opencode:
  layer: agent
  name: OpenCode
  summary: Open-source terminal agent for 75+ model providers, also in GitHub Actions.
  url: https://opencode.ai/docs/
continue:
  layer: agent
  name: Continue
  summary: Open-source agents for the IDE and CLI, for any model provider.
  url: https://docs.continue.dev/
auggie:
  layer: agent
  name: Auggie
  summary: Augment Code's agent in the terminal and in CI.
  url: https://docs.augmentcode.com/cli/overview
qwen-code:
  layer: agent
  name: Qwen Code
  summary: Alibaba's open-source terminal agent for Qwen and other OpenAI-compatible models.
  url: https://qwenlm.github.io/qwen-code-docs/en/

# Workflow
gitlab-ci:
  layer: workflow
  name: GitLab CI
  summary: GitLab pipelines that run agents on merge requests, issues or a schedule.
  url: https://docs.gitlab.com/ci/
slack:
  layer: workflow
  name: Slack
  summary: Start agents by mentioning them in Slack and get results back in the thread.
  url: https://slack.com
linear:
  layer: workflow
  name: Linear
  summary: Assign Linear issues to agents.
  url: https://linear.app/docs/agents-in-linear
jira:
  layer: workflow
  name: Jira
  summary: Assign Jira issues to agents.
  url: https://www.atlassian.com/software/jira
msteams:
  layer: workflow
  name: Microsoft Teams
  summary: Start agents from Teams chats.
  url: https://www.microsoft.com/microsoft-teams

# Schedulers
claude-desktop-scheduled-tasks:
  layer: scheduler
  name: Claude Desktop scheduled tasks
  summary: Local routines in the Claude desktop app that run on your machine with your files.
  url: https://code.claude.com/docs/en/desktop-scheduled-tasks
  needs:
    - parts: [on-prem]
      why: Desktop scheduled tasks run on your machine.
      source: https://code.claude.com/docs/en/desktop-scheduled-tasks
    - parts: [claude-code]
      why: Desktop scheduled tasks run Claude Code.
      source: https://code.claude.com/docs/en/desktop-scheduled-tasks
codex-automations:
  layer: scheduler
  name: Codex automations
  summary: Scheduled Codex tasks. Desktop tasks run locally, web tasks run in the cloud.
  url: https://learn.chatgpt.com/docs/automations?surface=app
  needs:
    - parts: [codex]
      why: Codex automations run Codex tasks.
      source: https://learn.chatgpt.com/docs/automations?surface=app
cursor-automations:
  layer: scheduler
  name: Cursor automations
  summary: Start Cursor cloud agents from presets or a cron schedule.
  url: https://cursor.com/docs/cloud-agent/automations
  needs:
    - parts: [cursor-cloud-agents]
      why: Cursor automations start Cursor cloud agents.
      source: https://cursor.com/docs/cloud-agent/automations
devin-scheduled-sessions:
  layer: scheduler
  name: Devin scheduled sessions
  summary: Run Devin sessions on a cron schedule or once at a set time.
  url: https://docs.devin.ai/product-guides/scheduled-sessions
  needs:
    - parts: [devin]
      why: Scheduled sessions are Devin sessions.
      source: https://docs.devin.ai/product-guides/scheduled-sessions
jules-scheduled-tasks:
  layer: scheduler
  name: Jules scheduled tasks
  summary: Daily or weekly Jules tasks.
  url: https://jules.google/docs/scheduled-tasks/
  needs:
    - parts: [jules]
      why: Scheduled tasks are Jules tasks.
      source: https://jules.google/docs/scheduled-tasks/
goose-schedule:
  layer: scheduler
  name: Goose schedule
  summary: Run Goose recipes on a cron schedule.
  url: https://github.com/aaif-goose/goose
  needs:
    - parts: [goose]
      why: goose schedule runs Goose recipes.
      source: https://www.mankier.com/1/goose-schedule
warp-schedules:
  layer: scheduler
  name: Warp schedules
  summary: Run Warp cloud agents on a schedule.
  url: https://docs.warp.dev/agent-platform/cloud-agents/overview
  needs:
    - parts: [warp-cloud-agents]
      why: Warp schedules start Warp cloud agents.
      source: https://docs.warp.dev/agent-platform/cloud-agents/overview
kiro-crew-cron:
  layer: scheduler
  name: Kiro Crew cron
  summary: Cron jobs and heartbeats built into Kiro Crew.
  url: https://kiro.dev/docs/crew/
  needs:
    - parts: [kiro-crew]
      why: The cron is part of Kiro Crew.
      source: https://kiro.dev/docs/crew/

# Models
gemini:
  layer: models
  name: Gemini
  summary: Google's models, through the Gemini API or Vertex AI.
  url: https://ai.google.dev/gemini-api/docs/models
mistral:
  layer: models
  name: Mistral
  summary: Mistral's models, including Devstral. Some have open weights.
  url: https://docs.mistral.ai/getting-started/models/
grok:
  layer: models
  name: Grok
  summary: xAI's models.
  url: https://docs.x.ai/docs/models
deepseek:
  layer: models
  name: DeepSeek
  summary: DeepSeek's models, through its API or as open weights.
  url: https://api-docs.deepseek.com/
qwen:
  layer: models
  name: Qwen
  summary: Alibaba's Qwen models, through Alibaba Cloud or as open weights.
  url: https://qwenlm.github.io/
kimi:
  layer: models
  name: Kimi
  summary: Moonshot AI's Kimi models.
  url: https://platform.moonshot.ai/docs


# ---- Added from platform research, 2026-10-07. Each rule cites its source. ----

# Agents and agent platforms
in-house-agent:
  layer: agent
  name: In-house agent
  summary: An agent a company built itself, often on top of an open-source agent or an SDK.
langgraph:
  layer: agent
  name: LangGraph
  summary: LangChain's framework for stateful agent graphs. LangSmith Deployment hosts them, with cron jobs.
  url: https://docs.langchain.com/langsmith/deployments
workflow-ai-step:
  layer: agent
  name: AI step in a workflow
  summary: A model call or agent step inside a workflow tool, with no separate agent product.
gitlab-duo:
  layer: agent
  name: GitLab Duo agents
  summary: GitLab's agents and flows in the Duo Agent Platform.
  url: https://docs.gitlab.com/user/duo_agent_platform/
rovo-dev:
  layer: agent
  name: Rovo Dev
  summary: Atlassian's coding agent, also an automatic pull request reviewer.
  url: https://www.atlassian.com/software/rovo-dev
claude-tag:
  layer: agent
  name: Claude Tag
  summary: Claude as a teammate in Slack channels, with scheduled jobs. It replaced the Claude in Slack app.
  url: https://claude.com/docs/claude-tag/overview
  needs:
    - parts: [cloud]
      why: Claude Tag runs in an ephemeral Anthropic sandbox, not on your computer.
      source: https://claude.com/docs/claude-tag/overview
    - parts: [claude]
      why: Claude Tag is an Anthropic product that runs Claude only.
      source: https://claude.com/docs/claude-tag/overview
    - parts: [slack]
      why: Claude Tag works inside Slack channels.
      source: https://claude.com/docs/claude-tag/overview
copilot-studio:
  layer: agent
  name: Microsoft Copilot Studio
  summary: Low-code studio for agents across Microsoft 365, Teams and the web, with scheduled triggers.
  url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/fundamentals-what-is-copilot-studio
  needs:
    - parts: [cloud]
      why: Copilot Studio is a hosted service with no self-host option.
      source: https://learn.microsoft.com/en-us/microsoft-copilot-studio/fundamentals-what-is-copilot-studio
    - parts: [openai, claude, grok, mistral]
      why: Copilot Studio agents use the models in its own list or models deployed in Microsoft Foundry.
      source: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-select-agent-model
azure-foundry-agent-service:
  layer: agent
  name: Microsoft Foundry Agent Service
  summary: Managed Azure service that hosts agents on models deployed in Microsoft Foundry.
  url: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
  needs:
    - parts: [cloud]
      why: Foundry Agent Service is a managed Azure service.
      source: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    - parts: [openai, grok, llama, deepseek]
      why: Agents use Foundry model deployments only.
      source: https://learn.microsoft.com/en-us/azure/foundry-classic/agents/concepts/model-region-support
bedrock-agentcore:
  layer: agent
  name: Amazon Bedrock AgentCore
  summary: AWS serverless platform that runs agents built with any framework and any model.
  url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
  needs:
    - parts: [cloud]
      why: AgentCore is a fully managed AWS service.
      source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
gemini-enterprise-agent-platform:
  layer: agent
  name: Gemini Enterprise Agent Platform
  summary: Google Cloud's platform, formerly Vertex AI, that hosts ADK, LangGraph and CrewAI agents.
  url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime
  needs:
    - parts: [cloud]
      why: Agent Runtime is a managed Google Cloud service.
      source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime
gemini-enterprise-agent-designer:
  layer: agent
  name: Gemini Enterprise Agent Designer
  summary: No-code agent builder in the Gemini Enterprise app, formerly Agentspace, with scheduled runs.
  url: https://docs.cloud.google.com/gemini/enterprise/docs/agent-designer
  needs:
    - parts: [cloud]
      why: Agent Designer is a hosted Google Cloud app.
      source: https://docs.cloud.google.com/gemini/enterprise/docs/agent-designer
salesforce-agentforce:
  layer: agent
  name: Salesforce Agentforce
  summary: CRM agents on Salesforce's Atlas reasoning engine, behind the Einstein Trust Layer.
  url: https://www.salesforce.com/agentforce/
  needs:
    - parts: [cloud]
      why: Agentforce runs only in Salesforce's cloud.
      source: https://www.salesforce.com/agentforce/
servicenow-ai-agents:
  layer: agent
  name: ServiceNow AI Agents
  summary: Agents in the ServiceNow AI Platform, built in AI Agent Studio.
  url: https://www.servicenow.com/docs/r/intelligent-experiences/na-ai-agents.html
  needs:
    - parts: [cloud]
      why: Now Assist is not available to self-hosted ServiceNow customers.
      source: https://www.servicenow.com/docs/r/intelligent-experiences/na-ai-agents.html
relevance-ai:
  layer: agent
  name: Relevance AI
  summary: No-code builder for teams of AI agents, with scheduled runs.
  url: https://relevanceai.com/docs
lindy:
  layer: agent
  name: Lindy
  summary: No-code assistant agents for email, meetings and CRM, with thousands of app integrations.
  url: https://docs.lindy.ai
crewai:
  layer: agent
  name: CrewAI
  summary: Python framework for teams of agents, plus a managed platform you can also self-host.
  url: https://docs.crewai.com
dify:
  layer: agent
  name: Dify
  summary: Open-source builder for LLM apps, agents and workflows, with a schedule trigger.
  url: https://docs.dify.ai
flowise:
  layer: agent
  name: Flowise
  summary: Open-source visual agent builder.
  url: https://docs.flowiseai.com
langflow:
  layer: agent
  name: Langflow
  summary: Open-source visual builder for agents and flows.
  url: https://docs.langflow.org

